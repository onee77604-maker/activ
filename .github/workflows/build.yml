name: Build GyroLock Motion Photo 3.0.17

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GyroLock Motion Photo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The source ZIP currently does not contain settings.gradle.
      # Generate it here so Gradle knows the :app module and repositories.
      - name: Prepare Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GyroLock"
          include(":app")
          EOF

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl unzip

          SDK_ROOT="$ANDROID_HOME"
          CMDLINE_DIR="$SDK_ROOT/cmdline-tools/latest"
          TMP_DIR="$RUNNER_TEMP/android-cmdline-tools"

          mkdir -p "$SDK_ROOT/cmdline-tools" "$TMP_DIR"

          curl -fL --retry 5 --retry-delay 2 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/commandlinetools.zip"

          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$TMP_DIR"

          rm -rf "$CMDLINE_DIR"
          mkdir -p "$CMDLINE_DIR"
          cp -a "$TMP_DIR/cmdline-tools/." "$CMDLINE_DIR/"

          test -x "$CMDLINE_DIR/bin/sdkmanager"

          echo "$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          "$CMDLINE_DIR/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -d "$ANDROID_HOME/cmake/3.22.1"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Java:"
          java -version
          echo "SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --list_installed

      - name: Install Vulkan shader compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          command -v glslangValidator
          glslangValidator --version

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/gyrolock_vulkan.cpp
          test -f app/src/main/cpp/fullscreen.vert
          test -f app/src/main/cpp/stabilize.frag

          echo "Project structure OK."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-Motion-Photo-3.0.17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-MotionPhoto-3.0.17-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            ~/.gradle/daemon/**/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 14
