name: Build GyroLock

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GyroLock"
          include(":app")
          EOF

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -L \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o /tmp/cmdline.zip

          unzip -q /tmp/cmdline.zip -d /tmp/cmdline

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a /tmp/cmdline/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug \
            2>&1 | tee build.log

      - name: Show ONLY important errors
        if: steps.build.outcome == 'failure'
        run: |
          echo ""
          echo "=========================================="
          echo "       GYROLOCK BUILD ERROR"
          echo "=========================================="
          echo ""

          echo "----- ERROR / FAILED -----"

          grep -iE \
            "error:|error |FAILED|fatal error|ninja: error|CMake Error|Exception" \
            build.log \
            | tail -100 \
            || true

          echo ""
          echo "----- LAST 80 LINES -----"

          tail -80 build.log

          echo ""
          echo "=========================================="
          echo "Jika masih belum jelas, lihat bagian"
          echo "di atas yang diawali 'error:' atau 'FAILED:'"
          echo "=========================================="

          exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-debug
          path: app/build/outputs/apk/debug/*.apk
